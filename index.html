<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃金收購紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">💰 黃金收購紀錄</h2>
        
        <form id="goldForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">分店</label>
                <select id="shop" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50" required>
                    <option value="">請選擇分店</option>
                    <option value="KF">KF 分店</option>
                    <option value="KS">KS 分店</option>
                    <option value="KL">KL 分店</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">經手員工</label>
                <select id="staff" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50" required>
                    <option value="">請選擇員工</option>
                    <option value="員工 1">員工 1</option>
                    <option value="員工 2">員工 2</option>
                    <option value="員工 3">員工 3</option>
                    <option value="員工 4">員工 4</option>
                </select>
            </div>

            <hr>

            <div>
                <label class="block text-sm font-medium text-gray-700">今日國際金價 (每克/錢)</label>
                <input type="number" id="marketPrice" placeholder="請輸入金額" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">收購重量 (克/兩)</label>
                <input type="text" id="weight" placeholder="例如: 5.23" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">實付客戶金額</label>
                <input type="number" id="payout" placeholder="請輸入金額" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50" required>
            </div>

            <button type="button" onclick="generateRecord()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition">
                生成紀錄報告
            </button>
        </form>

        <div id="resultArea" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
            <h3 class="text-sm font-bold text-green-800 mb-2">已生成紀錄內容：</h3>
            <p id="recordText" class="text-sm text-gray-700 whitespace-pre-wrap font-mono bg-white p-2 border mb-4"></p>
            <button onclick="copyToClipboard()" class="w-full bg-green-600 text-white py-2 rounded mb-2">複製內容</button>
            <p class="text-xs text-gray-500 text-center">請複製後傳送到經理 WhatsApp 或電郵</p>
        </div>
    </div>

    <script>
        function generateRecord() {
            const shop = document.getElementById('shop').value;
            const staff = document.getElementById('staff').value;
            const marketPrice = document.getElementById('marketPrice').value;
            const weight = document.getElementById('weight').value;
            const payout = document.getElementById('payout').value;
            const now = new Date();
            const timeStr = now.toLocaleString('zh-HK');

            if(!shop || !staff || !marketPrice || !payout) {
                alert('請填寫所有欄位');
                return;
            }

            const record = `【黃金收購紀錄】\n時間: ${timeStr}\n分店: ${shop}\n員工: ${staff}\n------------------\n當日金價: ${marketPrice}\n收購重量: ${weight}\n實付金額: $${payout}\n------------------`;
            
            document.getElementById('recordText').innerText = record;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('recordText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('紀錄已複製！請貼上到 WhatsApp 傳送。');
            });
        }
    </script>
</body>
</html>
