<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景輝金鋪管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hidden { display: none; }
        .record-card { transition: all 0.2s; }
        .record-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto space-y-4">
        <div class="bg-white p-6 rounded-2xl shadow-lg border-t-8 border-yellow-600">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">💰 收金計算器</h1>
                <input type="password" id="bossPass" placeholder="管理密碼" class="w-20 text-xs p-1 border rounded focus:outline-none focus:border-yellow-600" oninput="refreshUI()">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">分店</label>
                    <select id="shop" class="w-full p-3 border rounded-xl bg-gray-50 text-lg font-bold">
                        <option value="KF">KF 分店</option>
                        <option value="KS">KS 分店</option>
                        <option value="KL">KL 分店</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">經手人</label>
                    <select id="staff" class="w-full p-3 border rounded-xl bg-gray-50 text-lg font-bold">
                        <option value="員工1">員工 1</option>
                        <option value="員工2">員工 2</option>
                        <option value="員工3">員工 3</option>
                        <option value="員工4">員工 4</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 mb-1">今日景輝金價 (HKD/兩)</label>
                <input type="number" id="dailyPrice" inputmode="decimal" class="w-full p-4 border rounded-xl mb-2 text-2xl font-bold text-gray-700" placeholder="例如 21500">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-gray-500 mb-1">重量 (毫兩)</label>
                <input type="number" id="weight" inputmode="numeric" class="w-full p-4 border rounded-xl text-2xl font-bold text-gray-700" placeholder="1000 毫兩 = 1 兩">
            </div>

            <div id="resultDisplay" class="bg-blue-50 p-5 rounded-2xl mb-6 text-center hidden border border-blue-100">
                <p class="text-blue-600 text-sm font-bold mb-1">應付客戶金額</p>
                <p id="payoutText" class="text-4xl font-black text-blue-800"></p>
                <div id="profitDisplay" class="mt-3 py-2 bg-green-100 text-green-700 rounded-lg font-bold hidden"></div>
            </div>

            <div class="flex gap-3">
                <button onclick="calculate()" class="flex-1 bg-gray-700 text-white font-bold py-4 rounded-xl shadow-md active:bg-gray-800 transition">計算金額</button>
                <button onclick="submitToSheet()" id="submitBtn" class="flex-1 bg-yellow-600 text-white font-bold py-4 rounded-xl shadow-md active:bg-yellow-700 transition hidden">上傳紀錄</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">📋 收金紀錄 (全線)</h2>
                <button onclick="fetchRecords()" class="bg-gray-100 text-gray-600 p-2 rounded-full hover:bg-gray-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            
            <div id="recordList" class="space-y-4 max-h-[500px] overflow-y-auto pr-1">
                <p class="text-center text-gray-400 py-10">讀取數據中...</p>
            </div>
        </div>
    </div>

    <script>
        // --- 配置信息 ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpgoJtmNqrG73j-nLe7M1CG0X3BwEk1xeulAHnJ7BhOLNNdami3NBOQdHsEgJlij89/exec'; 
        const METALPRICE_API_KEY = 'b59eca630c98a8dbc001ff5d576db229';
        const BOSS_KEY = '888'; 

        let liveGoldPrice = null;
        let lastCalc = null;

        // 1. 獲取 API 市場實時金價
        async function fetchLivePrice() {
            try {
                const res = await fetch(`https://api.metalpriceapi.com/v1/latest?api_key=${METALPRICE_API_KEY}&base=USD&currencies=XAU`);
                const data = await res.json();
                const USDPerOunce = 1 / data.rates.XAU;
                // 轉換公式：(美元/盎司) / (盎司/兩比例) * 美元匯率
                liveGoldPrice = (USDPerOunce / (31.1035 / 37.429)) * 7.78;
                console.log("當前市場金價 (兩):", liveGoldPrice);
            } catch (e) {
                console.error("API 讀取失敗:", e);
            }
        }

        // 2. 計算功能
        function calculate() {
            const dailyPrice = parseFloat(document.getElementById('dailyPrice').value);
            const weight = parseFloat(document.getElementById('weight').value);
            
            if (!dailyPrice || !weight) {
                alert("請完整輸入店鋪金價及重量");
                return;
            }

            // 實付金額 = 店鋪金價 * (重量/1000) * 98% (扣除2%佣金)
            const payout = Math.ceil(dailyPrice * (weight / 1000) * 0.98);
            
            // 利潤 = (API實時金價 * 重量/1000) - 實付金額
            let profit = 0;
            if (liveGoldPrice) {
                profit = Math.floor((liveGoldPrice * (weight / 1000)) - payout);
            } else {
                console.warn("未取得 API 金價，利潤將顯示為 0");
            }

            lastCalc = { 
                shop: document.getElementById('shop').value,
                staff: document.getElementById('staff').value,
                dailyPrice: dailyPrice,
                weight: weight,
                payout: payout,
                profit: profit 
            };

            document.getElementById('payoutText').innerText = `HK$ ${payout.toLocaleString()}`;
            document.getElementById('resultDisplay').classList.remove('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            
            refreshUI(); 
        }

        // 3. 上傳數據到 Google Sheets
        async function submitToSheet() {
            if (!lastCalc) return;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            try {
                // 使用 POST 發送數據
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lastCalc)
                });
                
                alert("✅ 紀錄已成功同步至 Google 表格");
                document.getElementById('dailyPrice').value = '';
                document.getElementById('weight').value = '';
                document.getElementById('resultDisplay').classList.add('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
                lastCalc = null;
                
                setTimeout(fetchRecords, 1500); // 延遲刷新以確保數據已寫入
            } catch (e) {
                alert("❌ 同步失敗，請檢查網絡");
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerText = "上傳紀錄";
            }
        }

        // 4. 從 Google Sheets 獲取紀錄
        async function fetchRecords() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                const list = document.getElementById('recordList');
                const isBoss = document.getElementById('bossPass').value === BOSS_KEY;

                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-400 py-10">目前沒有成交紀錄</p>';
                    return;
                }

                // 顯示最新的紀錄在最上方
                list.innerHTML = data.slice().reverse().map(r => `
                    <div class="record-card bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="px-2 py-1 bg-gray-200 text-gray-700 text-xs font-bold rounded uppercase">${r.shop}</span>
                                <span class="ml-2 font-bold text-gray-700">${r.staff}</span>
                            </div>
                            <span class="text-gray-400 text-xs">${new Date(r.time).toLocaleString('zh-HK', {hour12:false, month:'numeric', day:'numeric', hour:'numeric', minute:'numeric'})}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="text-gray-500 text-sm">
                                重量: <span class="text-gray-800 font-bold">${r.weight} 毫兩</span>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-400">成交金額</p>
                                <p class="text-lg font-black text-blue-600">$${r.payout.toLocaleString()}</p>
                            </div>
                        </div>
                        ${isBoss ? `
                            <div class="mt-2 pt-2 border-t border-dashed border-gray-300 flex justify-between items-center">
                                <span class="text-xs text-green-600 font-bold">管理員查閱：</span>
                                <span class="text-md font-bold text-green-600">利潤: $${r.profit.toLocaleString()}</span>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (e) {
                console.error("獲取紀錄失敗:", e);
                document.getElementById('recordList').innerHTML = '<p class="text-center text-red-400 py-10">無法讀取數據，請重試</p>';
            }
        }

        // 5. 控制老闆視圖切換
        function refreshUI() {
            const isBoss = document.getElementById('bossPass').value === BOSS_KEY;
            const pDisplay = document.getElementById('profitDisplay');
            
            if (isBoss && lastCalc) {
                pDisplay.innerText = `📈 管理員估計利潤: HK$ ${lastCalc.profit.toLocaleString()}`;
                pDisplay.classList.remove('hidden');
            } else {
                pDisplay.classList.add('hidden');
            }
            fetchRecords(); 
        }

        // 啟動加載
        fetchLivePrice();
        fetchRecords();
        
        // 每 5 分鐘自動刷新金價與紀錄
        setInterval(() => {
            fetchLivePrice();
            fetchRecords();
        }, 300000);
    </script>
</body>
</html>
