<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景輝金鋪數據登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f3f4f6; padding: 15px; }
    .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; margin: auto; border-top: 10px solid #92400e; }
    label { display: block; margin: 18px 0 6px; font-weight: 800; color: #1f2937; }
    input, select { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 1.1rem; font-weight: bold; background: #fff; }
    input:focus, select:focus { border-color: #92400e; outline: none; background: #fffbeb; }
    .btn-submit { background: #b45309; color: white; width: 100%; padding: 18px; border-radius: 12px; font-size: 1.3rem; font-weight: 900; margin-top: 25px; box-shadow: 0 4px 15px rgba(180, 83, 9, 0.3); transition: 0.2s; }
    .btn-submit:active { transform: scale(0.96); }
    .admin-only { display: none; }
    .record-box { background: #f9fafb; padding: 15px; border-radius: 12px; border-left: 5px solid #d97706; margin-bottom: 12px; }
    .checkbox-container { display: flex; align-items: center; justify-content: center; background: #f9fafb; padding: 12px; border-radius: 12px; border: 2px solid #e5e7eb; cursor: pointer; transition: 0.2s; }
    .checkbox-container:hover { background: #fffbeb; border-color: #d97706; }
    .checkbox-container input { width: auto; margin-right: 8px; transform: scale(1.3); cursor: pointer; }
    
    .tab-btn { padding: 10px 15px; font-weight: 800; font-size: 0.95rem; border-radius: 8px; transition: 0.2s; }
    .tab-active { background: #92400e; color: white; }
    .tab-inactive { background: #e5e7eb; color: #4b5563; }
    .dash-card { background: #fdfbf7; border: 1px solid #f59e0b; padding: 15px; border-radius: 16px; text-align: center; }

    /* Modal 彈窗樣式 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 15px; }
    .modal-card { background: white; width: 100%; max-width: 420px; border-radius: 20px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-height: 90vh; overflow-y: auto; }

    /* 🖨️ iOS Safari & AirPrint 專屬列印修正 CSS */
    @media print {
      body * { display: none !important; }
      #printArea, #printArea * { display: block !important; }
      #printArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #printArea table { display: table !important; }
      #printArea tr { display: table-row !important; }
      #printArea td, #printArea th { display: table-cell !important; }
      #printArea div { display: block !important; }
      #printArea span { display: inline !important; }
      #printArea strong { display: inline !important; }

      @page {
        size: A4 portrait;
        margin: 6mm;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-black text-amber-900">景輝收金登記表</h1>
      <input type="password" id="bossPass" placeholder="管理" class="w-10 text-[8px] p-1 border rounded opacity-20" oninput="toggleAdminView()">
    </div>

    <!-- 📍 分店選擇 -->
    <label class="mt-0 text-red-600">📍 所屬分店 (必填) *</label>
    <div class="grid grid-cols-3 gap-3">
      <label class="checkbox-container m-0">
        <input type="radio" name="shopRadio" value="KF">
        <span class="text-sm font-bold text-gray-700">KF 店</span>
      </label>
      <label class="checkbox-container m-0">
        <input type="radio" name="shopRadio" value="KS">
        <span class="text-sm font-bold text-gray-700">KS 店</span>
      </label>
      <label class="checkbox-container m-0">
        <input type="radio" name="shopRadio" value="KL">
        <span class="text-sm font-bold text-gray-700">KL 店</span>
      </label>
    </div>

    <label>當日店鋪金價 (HKD/兩)</label>
    <input type="number" id="dailyPrice" placeholder="0" inputmode="decimal">

    <label>收購重量 (毫兩)</label>
    <input type="number" id="weight" placeholder="0" inputmode="numeric">

    <label>商品特例標記</label>
    <div class="grid grid-cols-2 gap-3">
      <label class="checkbox-container m-0 !justify-start">
        <input type="checkbox" id="diamondCheck">
        <span class="text-sm font-bold text-gray-700">💎 含鑽石</span>
      </label>
      <label class="checkbox-container m-0 !justify-start">
        <input type="checkbox" id="platinumCheck" onchange="togglePlatinumMode()">
        <span class="text-sm font-bold text-gray-700">⚪ 鉑金類別</span>
      </label>
    </div>

    <div id="purityArea">
      <label>黃金成色 (淨度)</label>
      <select id="puritySel" onchange="toggleCustomPurity()">
        <option value="1">足金 (9999 / 100%)</option>
        <option value="0.99">99金 (999 / 99%)</option>
        <option value="0.95">十足金/舊足金</option>
        <option value="0.916">22K 金 (91.6%)</option>
        <option value="0.75">18K 金 (75%)</option>
        <option value="0.585">14K 金 (58.5%)</option>
        <option value="custom">自訂純度 (%)</option>
      </select>

      <div id="customPurityDiv" class="hidden mt-2">
        <input type="number" id="customPurityInput" placeholder="請輸入純度數字 (例如 91.6)" inputmode="decimal">
      </div>
    </div>

    <label>實付客戶金額 (HKD)</label>
    <input type="number" id="actualPayout" placeholder="$ 0" class="border-amber-400 text-amber-900 text-2xl font-black" inputmode="numeric">

    <button id="previewBtn" onclick="openPreviewModal()" class="btn-submit">預覽並核對數據</button>

    <!-- 門市每日日結入口按鈕 -->
    <button onclick="openEODAuthModal()" class="w-full py-3 mt-4 bg-amber-100 text-amber-900 font-black rounded-xl border border-amber-300 hover:bg-amber-200">
      📑 門市當日結算對賬 (End of Day)
    </button>

    <!-- 👑 老闆專屬管理後台 (密碼 888) 👑 -->
    <div id="adminArea" class="admin-only mt-10 pt-6 border-t-4 border-double border-gray-200">
      <div class="flex justify-between items-center mb-6">
        <div class="flex gap-2">
          <button id="tabDashBtn" onclick="switchTab('dash')" class="tab-btn tab-active">📊 即時看板</button>
          <button id="tabListBtn" onclick="switchTab('list')" class="tab-btn tab-inactive">📋 交易明細</button>
        </div>
        <button onclick="fetchRecords()" class="text-amber-700 font-extrabold text-sm border-2 border-amber-600 px-3 py-1 rounded-lg">🔄 刷新數據</button>
      </div>

      <div id="dashboardView" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="dash-card col-span-2 !bg-amber-50">
            <div class="text-xs font-bold text-amber-800">本月累計預估總利潤</div>
            <div id="dashMonthProfit" class="text-2xl font-black text-green-600">$0</div>
          </div>
          <div class="dash-card">
            <div class="text-xs font-bold text-gray-500">今日收購總金額</div>
            <div id="dashTodayPayout" class="text-lg font-black text-gray-800">$0</div>
          </div>
          <div class="dash-card">
            <div class="text-xs font-bold text-gray-500">本月收購總金額</div>
            <div id="dashMonthPayout" class="text-lg font-black text-gray-800">$0</div>
          </div>
          <div class="dash-card">
            <div class="text-xs font-bold text-gray-500">本月足金總重 (兩)</div>
            <div id="dashMonthGoldWeight" class="text-lg font-black text-amber-700">0.00 兩</div>
          </div>
          <div class="dash-card">
            <div class="text-xs font-bold text-gray-500">本月鉑金總件數</div>
            <div id="dashMonthPlatCount" class="text-lg font-black text-blue-600">0 件</div>
          </div>
        </div>
        
        <div class="bg-gray-50 p-4 border rounded-xl">
          <div class="text-xs font-black text-gray-500 mb-2">📍 本月分店進貨支出排行榜 (HKD)</div>
          <div class="space-y-1 text-sm font-bold text-gray-700">
            <div class="flex justify-between"><span>KF 店:</span><span id="rankKF">$0</span></div>
            <div class="flex justify-between"><span>KS 店:</span><span id="rankKS">$0</span></div>
            <div class="flex justify-between"><span>KL 店:</span><span id="rankKL">$0</span></div>
          </div>
        </div>
      </div>

      <div id="listView" class="hidden space-y-3">
        <div id="recordList"></div>
      </div>
    </div>
  </div>

  <!-- 🔍 1. 二次核對預覽彈窗 (Preview Modal) -->
  <div id="previewModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="text-xl font-black text-amber-900 border-b pb-2 mb-4 text-center">🔎 請仔細核對單據數據</h3>
      
      <div class="space-y-3 text-sm font-bold text-gray-700">
        <div class="flex justify-between border-b pb-1">
          <span class="text-gray-500">所屬分店:</span>
          <span id="prevShop" class="text-amber-800 font-black text-base">-</span>
        </div>
        <div class="flex justify-between border-b pb-1">
          <span class="text-gray-500">當日金價:</span>
          <span id="prevDailyPrice">-</span>
        </div>
        <div class="flex justify-between border-b pb-1 items-center">
          <span class="text-gray-500">收購重量:</span>
          <div class="text-right">
            <div id="prevWeightMilli" class="font-black text-base text-gray-900">-</div>
            <div id="prevWeightTrad" class="text-xs text-amber-700 font-black bg-amber-50 px-2 py-0.5 rounded border border-amber-200 mt-0.5">-</div>
          </div>
        </div>
        <div class="flex justify-between border-b pb-1">
          <span class="text-gray-500">成色類別:</span>
          <span id="prevPurity">-</span>
        </div>
        <div class="flex justify-between border-b pb-1">
          <span class="text-gray-500">特例標記:</span>
          <span id="prevTags">-</span>
        </div>
        <div class="flex justify-between pt-2 items-center">
          <span class="text-gray-800 font-extrabold text-base">實付金額:</span>
          <span id="prevPayout" class="text-2xl font-black text-amber-900">$0</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-6">
        <button onclick="closePreviewModal()" class="w-full py-3 bg-gray-200 text-gray-700 font-black rounded-xl hover:bg-gray-300">❌ 返回修改</button>
        <button id="confirmSubmitBtn" onclick="submitToSheet()" class="w-full py-3 bg-amber-800 text-white font-black rounded-xl shadow-lg hover:bg-amber-900">✅ 確認上傳</button>
      </div>
    </div>
  </div>

  <!-- 🔒 2. 門市日結驗證彈窗 (EOD Auth Modal) -->
  <div id="eodAuthModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="text-lg font-black text-amber-900 mb-2 text-center">🔐 門市日結身份驗證</h3>
      <p class="text-xs text-gray-500 mb-4 text-center">請選擇分店並輸入專屬對賬密碼</p>
      
      <div class="space-y-3">
        <div>
          <label class="mt-0 text-xs font-bold text-gray-600">選擇分店</label>
          <select id="eodShopSel" class="!padding-2">
            <option value="KF">KF 分店</option>
            <option value="KS">KS 分店</option>
            <option value="KL">KL 分店</option>
          </select>
        </div>
        <div>
          <label class="mt-0 text-xs font-bold text-gray-600">門市對賬密碼</label>
          <input type="password" id="eodPassInput" placeholder="請輸入門市密碼" class="!padding-2">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-6">
        <button onclick="closeEODAuthModal()" class="w-full py-2.5 bg-gray-200 text-gray-700 font-black rounded-xl">取消</button>
        <button onclick="verifyAndOpenEOD()" class="w-full py-2.5 bg-amber-800 text-white font-black rounded-xl">進入對賬</button>
      </div>
    </div>
  </div>

  <!-- 📋 3. 門市當日結算對賬彈窗 (EOD Summary Modal) -->
  <div id="eodSummaryModal" class="modal-overlay hidden">
    <div class="modal-card !max-w-md">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="text-lg font-black text-amber-900"><span id="eodShopTitle">KF</span> 店今日日結結算</h3>
        <button onclick="closeEODSummaryModal()" class="text-gray-400 font-bold hover:text-gray-700">✕</button>
      </div>

      <div id="eodLoading" class="text-center py-8 text-gray-400 font-bold">正在讀取雲端當日數據...</div>

      <div id="eodContent" class="hidden space-y-4">
        <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 grid grid-cols-3 gap-2 text-center">
          <div>
            <div class="text-[10px] text-gray-500 font-bold">今日交易筆數</div>
            <div id="eodCount" class="text-base font-black text-gray-800">0 筆</div>
          </div>
          <div>
            <div class="text-[10px] text-gray-500 font-bold">今日總支出 (HKD)</div>
            <div id="eodTotalPayout" class="text-base font-black text-amber-900">$0</div>
          </div>
          <div>
            <div class="text-[10px] text-gray-500 font-bold">折合足金總重</div>
            <div id="eodTotalGold" class="text-base font-black text-amber-800">0.00 兩</div>
          </div>
        </div>

        <div class="text-xs font-bold text-gray-600 mb-1">今日交易明細紀錄：</div>
        <div id="eodList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>

        <button onclick="printA4DualReceipt()" class="w-full py-3 bg-amber-800 text-white font-black rounded-xl shadow-md hover:bg-amber-900 flex items-center justify-center gap-2">
          🖨️ 印出 A4 雙聯日結憑證 (AirPrint)
        </button>
      </div>
    </div>
  </div>

  <!-- 🖨️ 專屬 A4 雙聯列印容器 -->
  <div id="printArea" style="display:none;"></div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5nyjyVUsRz_ZGIjwWp35BxGrNdaWIHhkyA0LPbC2fDcAsbfq217qiSE0AaEp4gDkc/exec';
  const API_KEY = 'b59eca630c98a8dbc001ff5d576db229'; 
  const BOSS_KEY = '888';

  const STORE_PASSWORDS = {
    'KF': '111',
    'KS': '222',
    'KL': '333'
  };

  let livePrice = 0;
  let cachedRecords = [];
  let currentEODRecords = [];
  let currentEODShop = '';

  function formatToTraditionalTael(milliWeight) {
    const w = Math.round(Number(milliWeight));
    if (!w || w <= 0) return "0 厘";

    const tael = Math.floor(w / 1000);
    const mace = Math.floor((w % 1000) / 100);
    const candareen = Math.floor((w % 100) / 10);
    const cash = w % 10;

    let parts = [];
    if (tael > 0) parts.push(`${tael} 兩`);
    if (mace > 0 || tael > 0) parts.push(`${mace} 錢`);
    if (candareen > 0 || mace > 0 || tael > 0) parts.push(`${candareen} 分`);
    parts.push(`${cash} 厘`);

    return parts.join(" ");
  }

  async function updateLivePrice() {
    try {
      const res = await fetch(`https://api.metalpriceapi.com/v1/latest?api_key=${API_KEY}&base=USD&currencies=XAU`);
      const data = await res.json();
      let rawPrice = (1 / data.rates.XAU / (31.1035 / 37.429)) * 7.78;
      livePrice = Math.round(rawPrice - 500); 
    } catch (e) { console.log("Price fetch skipped"); }
  }

  function toggleCustomPurity() {
    const sel = document.getElementById('puritySel').value;
    const div = document.getElementById('customPurityDiv');
    div.style.display = (sel === 'custom') ? 'block' : 'none';
  }

  function togglePlatinumMode() {
    const isPlat = document.getElementById('platinumCheck').checked;
    const purityArea = document.getElementById('purityArea');
    purityArea.style.display = isPlat ? 'none' : 'block';
  }

  function toggleAdminView() {
    const isBoss = document.getElementById('bossPass').value === BOSS_KEY;
    const area = document.getElementById('adminArea');
    area.style.display = isBoss ? 'block' : 'none';
    if (isBoss) {
      updateLivePrice();
      fetchRecords();
    }
  }

  function switchTab(tab) {
    const dashBtn = document.getElementById('tabDashBtn');
    const listBtn = document.getElementById('tabListBtn');
    const dashView = document.getElementById('dashboardView');
    const listView = document.getElementById('listView');
    
    if (tab === 'dash') {
      dashBtn.className = "tab-btn tab-active";
      listBtn.className = "tab-btn tab-inactive";
      dashView.classList.remove('hidden');
      listView.classList.add('hidden');
    } else {
      dashBtn.className = "tab-btn tab-inactive";
      listBtn.className = "tab-btn tab-active";
      dashView.classList.add('hidden');
      listView.classList.remove('hidden');
    }
  }

  function openPreviewModal() {
    const selectedShop = document.querySelector('input[name="shopRadio"]:checked');
    const daily = parseFloat(document.getElementById('dailyPrice').value);
    const w = parseFloat(document.getElementById('weight').value);
    const payout = parseFloat(document.getElementById('actualPayout').value);
    const isPlat = document.getElementById('platinumCheck').checked;
    const hasDiam = document.getElementById('diamondCheck').checked;

    if (!selectedShop) return alert("❌ 提交失敗：請先勾選您所在的分店 (KF / KS / KL)！");
    if (!daily || !w || !payout) return alert("請完整填寫金價、重量及實付金額再預覽");

    let purityText = "";
    if (isPlat) {
      purityText = "⚪ 鉑金類別";
    } else {
      const puritySel = document.getElementById('puritySel');
      if (puritySel.value === 'custom') {
        const customNum = parseFloat(document.getElementById('customPurityInput').value);
        if (!customNum || customNum <= 0 || customNum > 100) return alert("請輸入有效的自訂純度 (0-100)");
        purityText = `自訂純度 (${customNum}%)`;
      } else {
        purityText = puritySel.options[puritySel.selectedIndex].text;
      }
    }

    let tagText = [];
    if (hasDiam) tagText.push("💎 含鑽石");
    if (isPlat) tagText.push("⚪ 鉑金");
    if (tagText.length === 0) tagText.push("無特殊標記");

    document.getElementById('prevShop').innerText = selectedShop.value + " 店";
    document.getElementById('prevDailyPrice').innerText = "$" + daily.toLocaleString() + " HKD/兩";
    document.getElementById('prevWeightMilli').innerText = w + " 毫兩";
    document.getElementById('prevWeightTrad').innerText = "即：" + formatToTraditionalTael(w);
    document.getElementById('prevPurity').innerText = purityText;
    document.getElementById('prevTags').innerText = tagText.join(" | ");
    document.getElementById('prevPayout').innerText = "$" + payout.toLocaleString() + " HKD";

    document.getElementById('previewModal').classList.remove('hidden');
  }

  function closePreviewModal() {
    document.getElementById('previewModal').classList.add('hidden');
  }

  function openEODAuthModal() {
    document.getElementById('eodPassInput').value = "";
    document.getElementById('eodAuthModal').classList.remove('hidden');
  }

  function closeEODAuthModal() {
    document.getElementById('eodAuthModal').classList.add('hidden');
  }

  function verifyAndOpenEOD() {
    const shop = document.getElementById('eodShopSel').value;
    const pass = document.getElementById('eodPassInput').value.trim();

    if (STORE_PASSWORDS[shop] && pass === STORE_PASSWORDS[shop]) {
      closeEODAuthModal();
      openEODSummaryModal(shop);
    } else {
      alert("❌ 密碼錯誤！請輸入正確的門市對賬密碼。");
    }
  }

  async function openEODSummaryModal(shop) {
    currentEODShop = shop;
    document.getElementById('eodShopTitle').innerText = shop;
    document.getElementById('eodSummaryModal').classList.remove('hidden');
    document.getElementById('eodLoading').classList.remove('hidden');
    document.getElementById('eodContent').classList.add('hidden');

    try {
      const res = await fetch(SCRIPT_URL);
      const allRecords = await res.json();
      
      const now = new Date();
      const todayStr = now.toDateString();

      currentEODRecords = allRecords.filter(r => {
        if (!r.time) return false;
        const rDate = new Date(r.time);
        return r.shop === shop && rDate.toDateString() === todayStr;
      });

      let totalPayout = 0;
      let totalGoldWeight = 0;

      const listDiv = document.getElementById('eodList');
      if (currentEODRecords.length === 0) {
        listDiv.innerHTML = "<p class='text-center text-gray-400 py-3'>今日尚無任何交易紀錄</p>";
      } else {
        listDiv.innerHTML = currentEODRecords.map(r => {
          totalPayout += Number(r.payout || 0);
          totalGoldWeight += Number(r.fineGoldWeight || 0);
          
          return `
            <div class="p-2 bg-gray-50 rounded-lg border text-xs flex justify-between items-center">
              <div>
                <span class="font-bold text-gray-800">${new Date(r.time).toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit', hour12:false})}</span>
                <span class="text-gray-500 ml-1">| ${r.purityLabel}</span>
                <div class="text-[10px] text-gray-400">${r.weight} 毫兩 (${formatToTraditionalTael(r.weight)})</div>
              </div>
              <div class="font-black text-amber-900 text-sm">$${Number(r.payout).toLocaleString()}</div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('eodCount').innerText = currentEODRecords.length + " 筆";
      document.getElementById('eodTotalPayout').innerText = "$" + totalPayout.toLocaleString();
      document.getElementById('eodTotalGold').innerText = totalGoldWeight.toFixed(2) + " 兩";

      document.getElementById('eodLoading').classList.add('hidden');
      document.getElementById('eodContent').classList.remove('hidden');

    } catch(e) {
      alert("載入日結數據失敗，請檢查網路連線");
      closeEODSummaryModal();
    }
  }

  function closeEODSummaryModal() {
    document.getElementById('eodSummaryModal').classList.add('hidden');
  }

  // 🖨️ 專門優化 iOS Safari 與 AirPrint 的列印調用邏輯

  async function submitToSheet() {
    const selectedShop = document.querySelector('input[name="shopRadio"]:checked');
    const daily = parseFloat(document.getElementById('dailyPrice').value);
    const w = parseFloat(document.getElementById('weight').value);
    const payout = parseFloat(document.getElementById('actualPayout').value);
    const isPlat = document.getElementById('platinumCheck').checked;
    const hasDiam = document.getElementById('diamondCheck').checked;

    let purityVal = 1;
    let purityLabel = "黃金";

    if (isPlat) {
      purityLabel = "鉑金";
      purityVal = 0; 
    } else {
      const puritySel = document.getElementById('puritySel');
      if (puritySel.value === 'custom') {
        const customNum = parseFloat(document.getElementById('customPurityInput').value);
        purityVal = customNum / 100;
        purityLabel = `自訂 (${customNum}%)`;
      } else {
        purityVal = parseFloat(puritySel.value);
        purityLabel = puritySel.options[puritySel.selectedIndex].text;
      }
    }

    const confirmBtn = document.getElementById('confirmSubmitBtn');
    confirmBtn.innerText = "上傳中..."; confirmBtn.disabled = true;

    await updateLivePrice();

    let profit = 0;
    let marketVal = 0;
    let fineGoldWeight = 0;
    let profitMargin = 0;

    if (!isPlat && !hasDiam) {
      marketVal = livePrice * (w / 1000) * purityVal;
      profit = Math.floor(marketVal - payout);
      fineGoldWeight = (w / 1000) * purityVal;
      if (marketVal > 0) {
        profitMargin = parseFloat(((profit / marketVal) * 100).toFixed(2));
      }
    } else {
      profit = 0;          
      fineGoldWeight = 0;  
      profitMargin = 0;    
    }

    const record = {
      shop: selectedShop.value, 
      staff: "門市", 
      dailyPrice: daily,
      weight: w,
      purityLabel: isPlat ? "鉑金" : (hasDiam ? `黃金 (${purityLabel} + 鑽石)` : purityLabel),
      livePrice: (isPlat || hasDiam) ? 0 : livePrice,
      payout: payout,
      profit: profit,
      hasDiamond: hasDiam,
      isPlatinum: isPlat,
      fineGoldWeight: fineGoldWeight, 
      profitMargin: profitMargin       
    };

    try {
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
      alert("✅ 數據已成功上傳雲端母表！");
      
      closePreviewModal();

      document.getElementById('dailyPrice').value = "";
      document.getElementById('weight').value = "";
      document.getElementById('actualPayout').value = "";
      document.getElementById('customPurityInput').value = "";
      document.getElementById('puritySel').value = "1"; 
      document.getElementById('diamondCheck').checked = false;
      document.getElementById('platinumCheck').checked = false;
      
      selectedShop.checked = false;
      togglePlatinumMode();
      toggleCustomPurity();
      
      if (document.getElementById('adminArea').style.display === 'block') {
        fetchRecords();
      }
    } catch (e) {
      alert("連線失敗，請檢查網路");
    } finally {
      confirmBtn.innerText = "✅ 確認上傳";
      confirmBtn.disabled = false;
    }
  }

  async function fetchRecords() {
    const list = document.getElementById('recordList');
    list.innerHTML = "<p class='text-center text-gray-400 py-4'>正在從 Google 試算表同步最新數據...</p>";
    
    try {
      const res = await fetch(SCRIPT_URL);
      cachedRecords = await res.json();
      
      calculateDashboard(cachedRecords);
      renderListView(cachedRecords);
      
    } catch (e) {
      list.innerHTML = "<p class='text-center text-red-400 py-4'>數據加載失敗，請點選重新整理</p>";
    }
  }

  function calculateDashboard(records) {
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();
    const todayStr = now.toDateString();
    
    let todayPayout = 0;
    let monthPayout = 0;
    let monthProfit = 0;
    let monthGoldWeight = 0;
    let monthPlatCount = 0;
    
    let shopMonthlySpend = { KF: 0, KS: 0, KL: 0 };

    records.forEach(r => {
      if (!r.time) return;
      const rDate = new Date(r.time);
      
      if (rDate.toDateString() === todayStr) {
        todayPayout += Number(r.payout || 0);
      }
      
      if (rDate.getFullYear() === currentYear && rDate.getMonth() === currentMonth) {
        monthPayout += Number(r.payout || 0);
        monthProfit += Number(r.profit || 0);
        monthGoldWeight += Number(r.fineGoldWeight || 0);
        
        if (r.isPlatinum === 'YES' || r.isPlatinum === true) {
          monthPlatCount++;
        }
        
        if (shopMonthlySpend.hasOwnProperty(r.shop)) {
          shopMonthlySpend[r.shop] += Number(r.payout || 0);
        }
      }
    });

    document.getElementById('dashTodayPayout').innerText = "$" + todayPayout.toLocaleString();
    document.getElementById('dashMonthPayout').innerText = "$" + monthPayout.toLocaleString();
    document.getElementById('dashMonthProfit').innerText = "$" + monthProfit.toLocaleString();
    document.getElementById('dashMonthGoldWeight').innerText = monthGoldWeight.toFixed(2) + " 兩";
    document.getElementById('dashMonthPlatCount').innerText = monthPlatCount + " 件";
    
    document.getElementById('rankKF').innerText = "$" + shopMonthlySpend.KF.toLocaleString();
    document.getElementById('rankKS').innerText = "$" + shopMonthlySpend.KS.toLocaleString();
    document.getElementById('rankKL').innerText = "$" + shopMonthlySpend.KL.toLocaleString();
  }

  function renderListView(records) {
    const list = document.getElementById('recordList');
    
    if(records.length === 0) {
      list.innerHTML = "<p class='text-center text-gray-400 py-4'>暫無任何交易紀錄</p>";
      return;
    }

    list.innerHTML = records.slice().reverse().map(r => {
      const formattedMargin = Number(r.profitMargin || 0).toFixed(2);
      const formattedFineWeight = Number(r.fineGoldWeight || 0).toFixed(2);
      
      return `
        <div class="record-box">
          <div class="flex justify-between text-[10px] font-black text-gray-400 mb-1">
            <span>${r.shop} - ${r.staff}</span>
            <span>${new Date(r.time).toLocaleString('zh-HK', {hour12:false})}</span>
          </div>
          <div class="text-xs text-gray-500 mb-1 flex justify-between">
            <span>類別: <span class="text-gray-700 font-bold">${r.purityLabel}</span></span>
            <span>利潤率: <span class="text-purple-600 font-bold">${formattedMargin}%</span></span>
          </div>
          <div class="text-[10px] text-gray-400 mb-1">
            標記: ${r.hasDiamond === 'YES' || r.hasDiamond === true ? '💎 含鑽石 ' : ''} ${r.isPlatinum === 'YES' || r.isPlatinum === true ? '⚪ 鉑金' : ''} | 折合: ${formattedFineWeight} 兩
          </div>
          <div class="flex justify-between items-center mt-1">
            <span class="text-sm font-bold text-gray-700">重量: ${r.weight} 毫兩</span>
            <span class="text-xl font-black text-amber-800">$${Number(r.payout).toLocaleString()}</span>
          </div>
          <div class="text-right text-green-600 font-bold text-xs mt-2 border-t border-dashed pt-1">
            預估利潤: $${Number(r.profit).toLocaleString()}
          </div>
        </div>
      `;
    }).join('');
  }

  updateLivePrice();
</script>
