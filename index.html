<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景輝金鋪數據上傳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f9fafb; padding: 15px; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 450px; margin: auto; border-top: 8px solid #92400e; }
    label { display: block; margin: 18px 0 6px; font-weight: 800; color: #374151; }
    input, select { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 1.1rem; font-weight: bold; }
    input:focus { border-color: #92400e; outline: none; background: #fffbeb; }
    .btn-submit { background: #b45309; color: white; width: 100%; padding: 18px; border-radius: 12px; font-size: 1.3rem; font-weight: 900; margin-top: 30px; box-shadow: 0 4px 12px rgba(180, 83, 9, 0.2); }
    .btn-submit:active { transform: scale(0.97); }
    .admin-only { display: none; }
    .history-card { background: #f3f4f6; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #b45309; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-black text-amber-900 text-center flex-1">💰 每日收金登記</h1>
      <input type="password" id="bossPass" placeholder="管理" class="w-12 text-[10px] p-1 border rounded opacity-30" oninput="toggleAdminView()">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="mt-0">分店</label>
        <select id="shopSel">
          <option value="KF">KF 分店</option>
          <option value="KS">KS 分店</option>
          <option value="KL">KL 分店</option>
        </select>
      </div>
      <div>
        <label class="mt-0">員工</label>
        <select id="staffSel">
          <option value="員工1">員工 1</option>
          <option value="員工2">員工 2</option>
          <option value="員工3">員工 3</option>
          <option value="員工4">員工 4</option>
        </select>
      </div>
    </div>

    <label>當日景輝金價 (HKD/兩)</label>
    <input type="number" id="dailyPrice" placeholder="0" inputmode="decimal">

    <label>重量 (毫兩)</label>
    <input type="number" id="weight" placeholder="0" inputmode="numeric">

    <label>實付給客人的金額 (HKD)</label>
    <input type="number" id="actualPayout" placeholder="$ 0" class="border-amber-300 text-amber-900 text-2xl" inputmode="numeric">

    <button id="submitBtn" onclick="submitToSheet()" class="btn-submit">確認並上傳紀錄</button>

    <div id="adminArea" class="admin-only mt-10 pt-6 border-t-2 border-dashed border-gray-200">
      <h2 class="font-black text-gray-800 mb-4 flex justify-between items-center">
        📋 全線收金紀錄 (管理員模式)
        <span class="text-xs font-normal text-blue-500 cursor-pointer" onclick="fetchRecords()">刷新數據</span>
      </h2>
      <div id="recordList" class="space-y-2"></div>
    </div>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5nyjyVUsRz_ZGIjwWp35BxGrNdaWIHhkyA0LPbC2fDcAsbfq217qiSE0AaEp4gDkc/exec';
  const API_KEY = 'b59eca630c98a8dbc001ff5d576db229'; // 仍用於背景計算利潤
  const BOSS_KEY = '888';

  let livePrice = 0;

  // 背景獲取金價（僅供管理員看利潤）
  async function getLivePrice() {
    try {
      const res = await fetch(`https://api.metalpriceapi.com/v1/latest?api_key=${API_KEY}&base=USD&currencies=XAU`);
      const data = await res.json();
      livePrice = (1 / data.rates.XAU / (31.1035 / 37.429)) * 7.78;
    } catch (e) { console.log("Price fetch skipped"); }
  }

  function toggleAdminView() {
    const isBoss = document.getElementById('bossPass').value === BOSS_KEY;
    const area = document.getElementById('adminArea');
    if (isBoss) {
      area.style.display = 'block';
      fetchRecords();
    } else {
      area.style.display = 'none';
    }
  }

  async function submitToSheet() {
    const daily = parseFloat(document.getElementById('dailyPrice').value);
    const w = parseFloat(document.getElementById('weight').value);
    const payout = parseFloat(document.getElementById('actualPayout').value);

    if (!daily || !w || !payout) return alert("請完整填寫所有欄位");

    const btn = document.getElementById('submitBtn');
    btn.innerText = "上傳中..."; btn.disabled = true;

    // 背景計算利潤存檔
    const marketVal = livePrice * (w / 1000);
    const profit = Math.floor(marketVal - payout);

    const record = {
      shop: document.getElementById('shopSel').value,
      staff: document.getElementById('staffSel').value,
      dailyPrice: daily,
      weight: w,
      payout: payout,
      profit: profit
    };

    try {
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
      alert("✅ 紀錄已成功提交！");
      // 清空輸入
      document.getElementById('dailyPrice').value = "";
      document.getElementById('weight').value = "";
      document.getElementById('actualPayout').value = "";
    } catch (e) { alert("上傳失敗"); }
    btn.innerText = "確認並上傳紀錄"; btn.disabled = false;
  }

  async function fetchRecords() {
    const list = document.getElementById('recordList');
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      list.innerHTML = data.slice().reverse().map(r => `
        <div class="history-card">
          <div class="flex justify-between text-[10px] font-bold text-gray-400">
            <span>${r.shop} - ${r.staff}</span>
            <span>${new Date(r.time).toLocaleDateString()} ${new Date(r.time).getHours()}:${String(new Date(r.time).getMinutes()).padStart(2,'0')}</span>
          </div>
          <div class="flex justify-between items-center mt-1">
            <span class="text-sm font-bold text-gray-700">${r.weight} 毫兩</span>
            <span class="font-black text-amber-800">$${r.payout.toLocaleString()}</span>
          </div>
          <div class="text-right text-green-600 font-bold text-[10px] mt-1">利潤: $${r.profit.toLocaleString()}</div>
        </div>
      `).join('');
    } catch (e) { list.innerHTML = "讀取失敗"; }
  }

  getLivePrice();
</script>
</body>
</html>
